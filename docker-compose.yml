services:
  scramjet:
    build: .
    container_name: scramjet
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      PROXY_PASSWORD: ${PROXY_PASSWORD:?Set PROXY_PASSWORD in .env or the environment}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "8080:8080"
